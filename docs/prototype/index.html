<script>
	'use strict';
	// ---------- 計算（設計書 第4章と同じ規則。金額は円の整数、工数は分の整数） ----------
	const COST_TYPES = [
		['labor', '労務原価'],
		['material', '材料費'],
		['outsource', '外注費'],
		['travel', '旅費交通費'],
		['other', 'その他直接費']
	];
	const sumObj = (o) => COST_TYPES.reduce((s, [k]) => s + (o[k] || 0), 0);
	const laborCost = (minutes, ratePerHour) =>
		ratePerHour == null ? null : Math.round((minutes * ratePerHour) / 60);
	const ratio = (num, den) =>
		den == null || den === 0 ? null : Math.round((num / den) * 1000) / 10;
	function remainingOf(fv) {
		const r = {};
		for (const [k] of COST_TYPES) {
			const l = fv.lines[k];
			r[k] =
				(l.committed || 0) +
				(l.other || 0) +
				(k === 'labor' ? laborCost(l.remMinutes || 0, fv.rate) : 0);
		}
		return r;
	}
	function forecastOf(fv) {
		const rem = remainingOf(fv);
		const actual = {};
		for (const [k] of COST_TYPES) actual[k] = fv.lines[k].actual;
		const a = sumObj(actual),
			r = sumObj(rem);
		return {
			actual,
			rem,
			actualSum: a,
			remSum: r,
			total: a + r,
			committed: COST_TYPES.reduce((s, [k]) => s + (fv.lines[k].committed || 0), 0)
		};
	}
	const confirmedOrder = (p) =>
		p.order + p.changes.filter((c) => c.status === 'approved').reduce((s, c) => s + c.delta, 0);
	const pendingAdditions = (p) => p.changes.filter((c) => c.status === 'pending');
	const adoptedForecast = (p) => [...p.forecasts].reverse().find((f) => f.kind === 'adopted');
	const recognizedSum = (p) => p.recognized.reduce((s, r) => s + r.amount, 0);

	function pipelineTotals(rows) {
		const active = rows.filter((r) => ACTIVE_STAGES.includes(r.stage));
		let total = 0,
			weighted = 0;
		const missingAmount = [],
			missingProb = [];
		for (const r of active) {
			if (r.amount == null) {
				missingAmount.push(r);
				continue;
			}
			total += r.amount;
			if (r.prob == null) {
				missingProb.push(r);
				continue;
			}
			weighted += Math.round((r.amount * r.prob) / 100);
		}
		return {
			count: active.length,
			total,
			weighted,
			missingAmount,
			missingProb,
			excluded: rows.length - active.length
		};
	}

	// 月次売上見通し: 計上実績 + 受注済み売上予定 + 未受注の売上予定×確度。三つは分けて返す
	function monthlyOutlook(st) {
		const out = {};
		const ensure = (m) => (out[m] ||= { rec: 0, plan: 0, weighted: 0 });
		MONTHS.forEach(ensure);
		ensure(UNDATED);
		const notes = [];
		for (const p of st.projects) {
			for (const r of p.recognized) ensure(r.month).rec += r.amount;
			for (const r of p.plan) ensure(r.month ?? UNDATED).plan += r.amount;
		}
		for (const v of st.pipeline) {
			if (!ACTIVE_STAGES.includes(v.stage)) continue;
			if (v.amount == null || v.prob == null) {
				notes.push(v);
				continue;
			}
			for (const r of v.revPlan)
				ensure(r.month ?? UNDATED).weighted += Math.round((r.amount * v.prob) / 100);
		}
		return { out, notes };
	}

	// ---------- サンプルデータ（仕様書 第12章の数値を使用） ----------
	const MONTHS = ['2026-11', '2026-12', '2027-01', '2027-02', '2027-03'];
	const UNDATED = '時期未定';
	const ACTIVE_STAGES = ['引合', '見積中', '交渉中', '内示あり'];
	const TODAY = '2026-12-10';
	const L = (actual, committed = 0, other = 0, remMinutes) => ({
		actual,
		committed,
		other,
		remMinutes
	});

	// ---------- 年度（6月開始・期番号表示）。第13期 = 2026年6月〜2027年5月 ----------
	const FY_START_MONTH = 6,
		FY_BASE = { period: 13, startYear: 2026 };
	function fiscalPeriod(ym) {
		const y = +ym.slice(0, 4),
			m = +ym.slice(5, 7);
		return FY_BASE.period + ((m >= FY_START_MONTH ? y : y - 1) - FY_BASE.startYear);
	}
	function periodLabel(ym) {
		const p = fiscalPeriod(ym),
			sy = FY_BASE.startYear + (p - FY_BASE.period);
		return `第${p}期（${sy}年${FY_START_MONTH}月〜${sy + 1}年${FY_START_MONTH - 1}月）`;
	}
	const CLOSED_UNTIL = '2026-11'; // 締め済みの最終月（サンプル）

	// ---------- 計算基準：会社基準（版・適用開始日）→ 案件別の上書き（項目ごと） ----------
	const CALC_ITEMS = [
		{
			key: 'empRate',
			group: '労務',
			label: '社員 時間原価単価（標準）',
			unit: '円/時',
			perm: '経理',
			project: true,
			note: '個人別・等級別の単価を登録した場合はそちらを優先。承認時に適用値を保存'
		},
		{
			key: 'fcRate',
			group: '労務',
			label: '見込み用単価（残工数）',
			unit: '円/時',
			perm: '経理・案件責任者',
			project: true,
			note: '完了見込の残工数を金額にする単価'
		},
		{
			key: 'budgetRate',
			group: '労務',
			label: '予算用単価',
			unit: '円/時',
			perm: '経理・案件責任者',
			project: true,
			note: '予算の予定工数を金額にする単価'
		},
		{
			key: 'outIn',
			group: '外注',
			label: '外注単価（社内作業）',
			unit: '円/時',
			perm: '経理・案件責任者',
			project: true,
			note: '外注先・契約ごとの単価がある場合はそちらを優先'
		},
		{
			key: 'outSite',
			group: '外注',
			label: '外注単価（現地作業）',

	function pickLatest(list, date) {
		let best = null;
		for (const x of list) if (x.from <= date && (!best || x.from >= best.from)) best = x;
		return best;
	}
	function resolve(key, projectId, date = TODAY) {
		if (projectId) {
			const ov = pickLatest(
				st.calc.overrides.filter((o) => o.key === key && o.project === projectId),
				date
			);
			if (ov && ov.value != null)
				return { value: ov.value, source: '案件上書き', from: ov.from, reason: ov.reason };
		}
		const c = pickLatest(
			st.calc.company.filter((x) => x.key === key),
			date
		);
		return c
			? { value: c.value, source: `会社基準 v${c.v}`, from: c.from }
			: { value: null, source: '未設定' };
	}

	function projectAlerts(p) {
		const a = [];
		const f = adoptedForecast(p);
		const fc = forecastOf(f);
		const order = confirmedOrder(p);
		const budget = sumObj(p.budgets.at(-1).lines);
		if (order - fc.total < 0) a.push(tag('bad', '完了見込赤字'));
		else if (ratio(order - fc.total, order) < resolve('lowMargin', p.id).value)
			a.push(tag('warn', '低利益率'));
		if (fc.total - budget > 0) a.push(tag('warn', '予算超過見込み'));
		if (sumObj(p.latestActual) !== fc.actualSum) a.push(tag('warn', '見込更新要'));
		if (pendingAdditions(p).length) a.push(tag('info', '未確定追加売上'));
		if (p.unapproved.count) a.push(tag('warn', `未承認 ${p.unapproved.count}件`));
		if (p.missingRate) a.push(tag('bad', '原価未確定'));
		if (p.status === '作業完了' && fc.committed > 0) a.push(tag('warn', '未精算発注残'));
		return a;
	}
	function pipelineAlerts(v) {
		const a = [];
		if (!ACTIVE_STAGES.includes(v.stage)) return a;
		if (v.orderMonth && v.orderMonth < TODAY.slice(0, 7)) a.push(tag('bad', '受注予定月超過'));
		if ((Date.parse(TODAY) - Date.parse(v.confirmed)) / 864e5 > resolve('staleDays', null).value)
			a.push(tag('warn', '確認遅れ'));
		if (v.amount == null) a.push(tag('warn', '金額未設定'));
		if (v.prob == null) a.push(tag('warn', '確度未設定'));
		if (!v.orderMonth) a.push(tag('warn', '受注月未定'));
		if (v.revPlan.some((r) => r.month == null)) a.push(tag('plain', '売上時期未定'));
		return a;
	}

	function outlookChart(out) {
		const ms = [...MONTHS, UNDATED];
		const max = Math.max(1, ...ms.map((m) => out[m].rec + out[m].plan + out[m].weighted));
		const step = max > 4e6 ? 1e6 : 5e5;
		const top = Math.ceil(max / step) * step;
		const W = 640,
			H = 240,
			padL = 48,
			padB = 26,
			padT = 10,
			bw = 46;
		const x = (i) => padL + 20 + i * ((W - padL - 30) / ms.length);
		const y = (v) => padT + (H - padT - padB) * (1 - v / top);
		let g = '';
		for (let v = 0; v <= top; v += step)
			g += `<line x1="${padL}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-soft)"/><text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${v / 1e6}M</text>`;
		ms.forEach((m, i) => {
			let base = 0;
			for (const [k, col] of [
				['rec', 'var(--ink)'],
				['plan', 'var(--plan)'],
				['weighted', 'var(--weighted)']
			]) {
				const v = out[m][k];
				if (!v) continue;
				g += `<rect x="${x(i)}" width="${bw}" y="${y(base + v)}" height="${y(base) - y(base + v)}" fill="${col}"><title>${mlabel(m)} ${k}: ${v.toLocaleString('ja-JP')}円</title></rect>`;
				base += v;
			}
			g += `<text x="${x(i) + bw / 2}" y="${H - 8}" text-anchor="middle">${m === UNDATED ? '未定' : Number(m.slice(5)) + '月'}</text>`;
		});
		return `<div class="tablewrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:480px;max-width:760px" role="img" aria-label="月別の売上見通し（積み上げ）">${g}</svg></div>`;
	}

	function viewOutlook() {
		const { out, notes } = monthlyOutlook(st);

    ${basis(periodLabel(TODAY.slice(0, 7)), '税抜・円', '基準日 2026-12-10', '受注予定月とは別に、売上予定月で集計')}</div>

    ${notes.length ? `<div class="callout">確度加重の計算から除外：${notes.map((n) => `${esc(n.name)}（${n.amount == null ? '金額未設定' : '確度未設定'}${n.amount != null ? '・' + n.amount.toLocaleString('ja-JP') + '円' : ''}）`).join('、')}</div>` : ''}
    <div class="row"><button class="btn" type="button" id="snap">現在の見通しをスナップショット保存</button></div>
  </section>`;
	}

  </section>`;

	function viewProject() {
		const p = st.projects.find((x) => x.id === detailId) || st.projects[0];

  <div class="pagehead"><div><p><a href="#projects">受注案件一覧</a> ／ ${esc(p.id)}</p><h1>${esc(p.name)}</h1><p>${esc(p.customer)}・責任者 ${esc(p.manager)}・${esc(p.status)}</p></div>

  ${p.status !== '作業完了' ? `<div class="sample-note">途中実績：原価が先に発生し、売上は検収後に計上されます。途中の実績直接利益がマイナスでも、最終赤字を意味しません。</div>` : ''}

					const l = draft.lines[k];

						k === 'labor'
							? `<input class="amt" type="number" step="0.25" min="0" id="fv-h" data-fv="remMinutes" data-k="${k}" value="${(l.remMinutes || 0) / 60}" aria-label="残工数（時間）"> 時間 × ${draft.rate.toLocaleString('ja-JP')}円<br><span class="note">見込み用単価：${rs.source}</span>`

      <tr><td>売上計上額（経理承認済み）</td><td class="n">${yen(rec)}</td></tr>

    <section class="panel"><h2>売上計上予定</h2><div class="tablewrap"><table><thead><tr><th>予定月</th><th class="n">予定額</th></tr></thead><tbody>

      ${planSum !== order - rec ? `<div class="callout">予定の合計 ${planSum.toLocaleString('ja-JP')}円が未計上残 ${(order - rec).toLocaleString('ja-JP')}円と一致しません。予定月の配分を見直してください。</div>` : tag('good', '未計上残と一致')}

      ${p.forecasts
				.map((x) => {
					const c = forecastOf(x);
					return `<tr><td>v${x.v}</td><td>${x.kind === 'adopted' ? tag('good', x === f ? '採用（最新）' : '採用（過去）') : tag('plain', '下書き')}</td><td>${x.base}</td><td class="n">${yen(c.actualSum)}</td><td class="n">${yen(c.remSum)}</td><td class="n">${yen(c.total)}</td><td class="wrap">${esc(x.reason)}${x.confirmedBy ? `<br><span class="note">確認 ${esc(x.confirmedBy)}</span>` : ''}</td></tr>`;

	const fmtVal = (v, i) =>
		v == null
			? '<span class="na">未設定</span>'

	function impactOf(key, from) {
		if (!from) return ['適用開始日を入力すると影響を表示します。'];
		const ov = overriddenProjects(key);
		const lines = [
			`会社基準に従う案件 ${st.projects.length - ov.size}件に適用します。この項目を上書きしている案件 ${ov.size}件は変わりません。`
		];
		if (['empRate', 'outIn', 'outSite', 'dayHours'].includes(key)) {
			const un = st.approvals.filter((a) => a.status === '申請' && a.date >= from).length;
			const ap = st.approvals.filter((a) => a.status === '承認' && a.date >= from).length;
			lines.push(`適用開始日以降の未承認工数 ${un}件は、承認時に新しい値で計算します。`);
			lines.push(
				ap
					? `承認済み工数 ${ap}件は自動では変えません。再計算訂正の候補として一覧に出し、再承認で反映します。`
					: '適用開始日以降に承認済みの工数はありません。'
			);
		}
		if (['fcRate', 'lodging', 'carKm', 'dayHours'].includes(key))
			lines.push(
				'下書きの見込版は新しい値で再計算します。採用済みの見込版は変えず、「見込更新要」で再見積りを促します。'
			);
		if (key === 'budgetRate')
			lines.push('承認済みの予算版は変わりません。これから作る予算案に使います。');
		if (from.slice(0, 7) <= CLOSED_UNTIL)
			lines.push(
				`締め済みの月（${CLOSED_UNTIL}まで）を含みます。反映するには経理による再開か翌月調整が必要です。`
			);
		return lines;
	}

  <section class="panel">

      <thead><tr><th>区分</th><th>項目</th><th class="n">現在の会社基準</th><th>版・適用開始日</th><th class="n">案件別の上書き</th><th>変更権限</th><th></th></tr></thead>

  <section class="panel"><h2>上書きの履歴</h2>${

	const DAYS = ['12/7 月', '12/8 火', '12/9 水', '12/10 木', '12/11 金'];
	function viewTime() {
		const totals = DAYS.map((_, i) => st.time.reduce((s, r) => s + r.day[i], 0));
		const unit = resolve('inputUnit', null).value;
		const rows = st.time
			.map(
				(r) => `<tr><td>${esc(r.project)}</td><td>${esc(r.phase)}</td>
    ${r.day.map((m, i) => `<td class="n"><input class="cell ${m % unit ? 'err' : ''}" type="number" step="0.25" min="0" max="24" id="t-${r.id}-${i}" data-t="${r.id}" data-i="${i}" value="${m ? m / 60 : ''}" ${r.status !== '下書き' && r.status !== '差戻し' ? 'disabled' : ''} aria-label="${esc(r.project)} ${DAYS[i]}"></td>`).join('')}

      <tbody>${rows}</tbody></table></div>
    <p class="note">単価が未登録の工数は0円で確定せず「原価未確定」とします。役割を「経理担当者」に切り替えると個人別単価が表示されます。</p>

	// ---------- 描画とイベント ----------
	function render() {
		const view = currentView();
		renderNav(view);
		const fn = {
			pipeline: viewPipeline,
			outlook: viewOutlook,
			projects: viewProjects,
			project: viewProject,
			time: viewTime,
			approvals: viewApprovals,
			settings: viewSettings
		}[view];
		document.getElementById('main').innerHTML =
			`<p class="sample-note">サンプルデータによる画面プロトタイプです。保存・認証・権限制御はありません。数値は仕様書0.3 第12章の計算例に合わせています。</p>` +
			fn();
	}
	window.addEventListener('hashchange', render);
	document.getElementById('role').addEventListener('change', () => {
		location.hash = '';
		render();
	});
	document.getElementById('reset').addEventListener('click', () => {
		st = initialState();
		st.snapshot = takeSnapshot('2026-11-30 月末スナップショット');
		render();
		toast('サンプルを初期状態に戻しました');
	});

	const main = document.getElementById('main');
	main.addEventListener('change', (e) => {
		const t = e.target;
		if (t.dataset.pl) {
			const v = st.pipeline.find((x) => x.id === t.dataset.id);
			const val = t.value === '' ? null : Math.max(0, Number(t.value));
			if (t.dataset.pl === 'prob') v.prob = val == null ? null : Math.min(99, val);
			else {
				v.amount = val;
				v.revPlan =
					v.revPlan.length === 1 ? [{ month: v.revPlan[0].month, amount: val ?? 0 }] : v.revPlan;
			}
			v.confirmed = TODAY;
			st.pipelineHistory.push(
				`${TODAY} ${v.name}：${t.dataset.pl === 'prob' ? '確度' : '見込受注額'}を ${val == null ? '未設定' : val.toLocaleString('ja-JP')} に変更（理由入力は実装時に必須）`
			);
			render();
		} else if (t.dataset.t) {
			const r = st.time.find((x) => x.id === Number(t.dataset.t));
			r.day[Number(t.dataset.i)] = Math.round(Math.max(0, Number(t.value || 0)) * 60);
			render();
		} else if (t.dataset.fv) {
			const p = st.projects.find((x) => x.id === detailId);
			const d = p.forecasts.find((x) => x.kind === 'draft');
			const n = Math.max(0, Number(t.value || 0));
			d.lines[t.dataset.k][t.dataset.fv] =
				t.dataset.fv === 'remMinutes' ? Math.round(n * 60) : Math.round(n);
			render();
		} else if (t.dataset.sd === 'from') {
			settingsDraft = {
				value: document.getElementById('sd-value').value,
				from: t.value,
				reason: document.getElementById('sd-reason').value
			};
			render();
		} else if (t.dataset.fvReason !== undefined) {
			st.projects.find((x) => x.id === detailId).forecasts.find((x) => x.kind === 'draft').reason =
				t.value;
		}
	});
	main.addEventListener('click', (e) => {
		const b = e.target.closest('button, tr[data-open]');
		if (!b) return;
		if (b.dataset.open) {
			location.hash = 'project-' + b.dataset.open;
			detailTab = 'forecast';
			return;
		}
		if (b.dataset.tab) {
			detailTab = b.dataset.tab;
			render();
			return;
		}
		if (b.dataset.convert) {
			const v = st.pipeline.find((x) => x.id === b.dataset.convert);
			const amount = v.id === 'P-2026-040' ? 2800000 : v.amount;
			v.stage = '受注済み';
			v.converted = true;
			st.projects.push({
				id: v.id,
				name: v.name,
				customer: v.customer,
				manager: v.sales,
				status: '受注',
				order: amount,
				changes: [],
				recognized: [],
				plan: v.revPlan.map((r) => ({
					month: r.month,
					amount: Math.round((r.amount * amount) / v.amount)
				})),
				budgets: [
					{
						v: 1,
						status: '承認',
						reason: '受注時の原価概算を当初予算に採用（デモ）',
						by: '経理 山本',
						on: TODAY,
						lines: {
							labor: Math.round((v.estCost || 0) * 0.5),
							material: Math.round((v.estCost || 0) * 0.3),
							outsource: Math.round((v.estCost || 0) * 0.2),
							travel: 0,
							other: 0
						}
					}
				],
				latestActual: { labor: 0, material: 0, outsource: 0, travel: 0, other: 0 },
				forecasts: [
					{
						v: 1,
						kind: 'adopted',
						base: TODAY,
						rate: 5000,
						by: v.sales,
						confirmedBy: '部長 中村',
						reason: '受注時の初回見込',
						lines: {
							labor: L(0, 0, Math.round((v.estCost || 0) * 0.5)),
							material: L(0, 0, Math.round((v.estCost || 0) * 0.3)),
							outsource: L(0, 0, Math.round((v.estCost || 0) * 0.2)),
							travel: L(0),
							other: L(0)
						}
					}
				],
				unapproved: { count: 0, minutes: 0 },
				missingRate: 0
			});
			st.pipelineHistory.push(
				`${TODAY} ${v.name}：${amount.toLocaleString('ja-JP')}円で受注転換。未受注見込から除外し、確定受注側に一度だけ計上（売上は自動計上しません）`
			);
			render();
			toast('受注転換しました。月次売上見通しで12月の変化を確認できます');
			return;
		}
		if (b.dataset.editItem) {
			editingKey = b.dataset.editItem;
			settingsDraft = {
				value: String(resolve(editingKey, null).value ?? ''),
				from: TODAY,
				reason: ''
			};
			render();
			document.getElementById('sd-value')?.focus();
			return;
		}
		if (b.id === 'set-cancel') {
			editingKey = null;
			render();
			return;
		}
		if (b.id === 'set-save') {
			const raw = document.getElementById('sd-value').value,
				from = document.getElementById('sd-from').value,
				reason = document.getElementById('sd-reason').value.trim();
			const val = raw === '' ? NaN : Number(raw);
			if (!Number.isFinite(val) || val < 0) return toast('新しい値を0以上の数値で入力してください');
			if (!from) return toast('適用開始日を入力してください');
			if (!reason) return toast('変更理由を入力してください');
			const v =
				Math.max(0, ...st.calc.company.filter((c) => c.key === editingKey).map((c) => c.v)) + 1;
			st.calc.company.push({
				key: editingKey,
				from,
				value: val,
				v,
				reason,
				by: ROLE_LABEL[currentRole()]
			});
			const label = itemOf(editingKey).label;
			editingKey = null;
			render();
			toast(`${label} を v${v}（${from}から）として保存しました`);
			return;
		}
		if (b.dataset.ovSave || b.dataset.ovClear) {
			const key = b.dataset.ovSave || b.dataset.ovClear,
				item = itemOf(key);
			const from = document.getElementById('ov-from-' + key).value,
				reason = document.getElementById('ov-reason-' + key).value.trim();
			let value = null;
			if (b.dataset.ovSave) {
				const raw = document.getElementById('ov-val-' + key).value;
				if (raw === '') return toast('上書きする値を入力してください');
				value = Number(raw);
				if (!(value >= 0)) return toast('0以上の数値を入力してください');
			}
			if (!from) return toast('適用開始日を入力してください');
			if (!reason) return toast('理由を入力してください');
			st.calc.overrides.push({
				project: detailId,
				key,
				from,
				value,
				reason,
				by: ROLE_LABEL[currentRole()]
			});
			render();
			toast(
				value == null
					? `${item.label} を会社基準に戻しました`
					: `${item.label} をこの案件だけ ${value.toLocaleString('ja-JP')} ${item.unit} に変更しました`
			);
			return;
		}
		if (b.id === 'snap') {
			st.snapshot = takeSnapshot(`${TODAY} 保存のスナップショット`);
			render();
			toast('スナップショットを保存しました');
			return;
		}
		if (b.id === 'adopt') {
			const p = st.projects.find((x) => x.id === detailId);
			const d = p.forecasts.find((x) => x.kind === 'draft');
			d.kind = 'adopted';
			d.confirmedBy = '部長 中村';
			detailTab = 'forecast';
			render();
			toast(`見込版 v${d.v} を採用しました`);
			return;
		}
		if (b.id === 'newdraft') {
			const p = st.projects.find((x) => x.id === detailId);
			const f = adoptedForecast(p);
			const lines = {};
			for (const [k] of COST_TYPES) lines[k] = { ...f.lines[k], actual: p.latestActual[k] };
			p.forecasts.push({
				v: Math.max(...p.forecasts.map((x) => x.v)) + 1,
				kind: 'draft',
				base: TODAY,
				rate: f.rate,
				by: p.manager,
				confirmedBy: null,
				reason: '',
				lines
			});
			render();
			toast('最新実績を基準日実績にした下書きを作成しました。残見込みを再見積りしてください');
			return;
		}
		if (b.id === 'approveChange') {
			const p = st.projects.find((x) => x.id === detailId);
			for (const c of p.changes)
				if (c.status === 'pending') {
					c.status = 'approved';
					p.plan.push({ month: '2027-02', amount: c.delta });
				}
			const add = st.pipeline.find((x) => x.addition === p.id);
			if (add) {
				add.stage = '受注済み';
				add.converted = true;
			}
			render();
			toast('受注変更を承認しました。追加見込は未受注側から外れます');
			return;
		}
		if (b.id === 'submitWeek') {
			st.time.forEach((r) => {
				if (r.status === '下書き') r.status = '申請';
			});
			render();
			toast('申請しました');
			return;
		}
		if (b.dataset.approve || b.dataset.return) {
			const a = st.approvals.find((x) => x.id === (b.dataset.approve || b.dataset.return));
			a.status = b.dataset.approve ? '承認' : '差戻し';
			render();
			toast(
				b.dataset.approve
					? a.rate == null
						? '承認しました。単価が未登録のため原価未確定のままです'
						: '承認しました。適用単価と原価を保存しました'
					: '差し戻しました（理由入力は実装時に必須）'
			);
		}
	});
	main.addEventListener('keydown', (e) => {
		if (e.key === 'Enter' && e.target.dataset?.open) e.target.click();
	});
	render();
</script>
